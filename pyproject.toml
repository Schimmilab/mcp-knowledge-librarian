[project]
name = "mcp-knowledge-librarian"
version = "0.3.0"
description = "MCP server for indexing and searching PDF libraries with citation support"
authors = [{name = "Schimmilab"}]
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2,<2",
    "pypdf>=4.0.0",
    "pydantic>=2.0.0",
    "aiohttp>=3.9.0",
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
ocr = [
    "pytesseract>=0.3.10",
    "pillow>=10.0.0",
    # full-page rendering for scanned PDFs; needs the poppler system binary
    # (macOS: `brew install poppler`)
    "pdf2image>=1.16.0",
]
semantic = [
    # local embeddings + cross-encoder reranking (pulls in torch)
    "sentence-transformers>=2.2.0",
    "numpy>=1.24",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "reportlab>=4.0.0",
    # embedding/RRF tests use synthetic vectors - numpy only, no torch
    "numpy>=1.24",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
